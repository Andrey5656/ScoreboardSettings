name: ScoreboardSettings
version: '${project.version}'
main: com.andrey.scoreboardsettings.ScoreboardSettings
api-version: '1.21.7'
folia-supported: true
author: Andrey
description: A scoreboard where every player picks which rows they see, from a dialog menu.
softdepend:
  - PlaceholderAPI
libraries:
  - org.jetbrains.kotlin:kotlin-stdlib:2.3.21
  - com.zaxxer:HikariCP:5.1.0
  - org.xerial:sqlite-jdbc:3.53.2.1
  - com.mysql:mysql-connector-j:9.7.0

permissions:
  scoreboardsettings.reload:
    description: Reload the config with /sbsettings reload.
    default: op
